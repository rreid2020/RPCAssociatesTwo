name: rpc-associates
region: nyc
services:
  - name: web
    github:
      # Update this with your actual repository
      repo: your-username/your-repo-name
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npx serve -s dist -l 8080
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    routes:
      - path: /
    health_check:
      http_path: /
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      # Vite inlines VITE_* at build — use BUILD_TIME or RUN_AND_BUILD_TIME in DO so `npm run build` sees them
      - key: VITE_SITE_URL
        value: https://axiomft.ca
        scope: RUN_AND_BUILD_TIME
      - key: VITE_SANITY_PROJECT_ID
        value: t3zpylpm
        scope: RUN_AND_BUILD_TIME
      - key: VITE_SANITY_DATASET
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: VITE_SANITY_API_VERSION
        value: "2024-01-01"
        scope: RUN_AND_BUILD_TIME

  - name: api
    github:
      repo: your-username/your-repo-name
      branch: main
      deploy_on_push: true
    source_dir: api/server
    build_command: npm install
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    routes:
      - path: /api
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "3000"
        scope: RUN_TIME
      # Use pooled DATABASE_URL in App Platform UI. Tune per replica count at scale.
      - key: DATABASE_POOL_MAX
        value: "12"
        scope: RUN_TIME
      - key: DATABASE_POOL_MIN
        value: "2"
        scope: RUN_TIME
      - key: API_INSTANCE_COUNT
        value: "1"
        scope: RUN_TIME
      # Database (required — api/server no longer reads DB_* fallbacks)
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      # Email Configuration (Resend)
      - key: RESEND_API_KEY
        value: REPLACE_IN_APP_PLATFORM
        scope: RUN_TIME
      - key: EMAIL_FROM
        value: "Axiom Financial & Technology <noreply@axiomft.ca>"
        scope: RUN_TIME
      - key: NOTIFICATION_EMAIL
        value: info@axiomft.ca
        scope: RUN_TIME
      # CORS Configuration
      - key: ALLOWED_ORIGINS
        value: https://axiomft.ca,https://www.axiomft.ca,https://portal.axiomft.ca,http://localhost:5173
        scope: RUN_TIME
      # File repository: add these on the **api** component in the App Platform UI (Settings → App-Level Environment Variables) or here with SECRET type—do not commit real keys:
      #   CLERK_SECRET_KEY
      #   DO_SPACES_ENDPOINT=https://tor1.digitaloceanspaces.com
      #   DO_SPACES_BUCKET=rpc-associates-space
      #   DO_SPACES_KEY= (Spaces access key)
      #   DO_SPACES_SECRET= (Spaces secret; use encrypted/SECRET in UI)
      #   DO_SPACES_REGION=us-east-1
      # See api/server/PORTAL_FILE_STORAGE_SETUP.md
      # TaxGPT chat (set in App Platform UI as SECRET):
      #   OPENAI_API_KEY
      #   OPENAI_MODEL=gpt-4o-mini
      #   OPENAI_EMBED_MODEL=text-embedding-3-small

jobs:
  - name: taxgpt-corpus
    kind: SCHEDULED
    schedule:
      cron: "0 * * * *"
      time_zone: America/Toronto
    dockerfile_path: client-portal/Dockerfile.taxgpt-corpus
    instance_size_slug: basic-s
    instance_count: 1
    github:
      repo: your-username/your-repo-name
      branch: main
      deploy_on_push: true
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
        scope: RUN_TIME
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
        scope: RUN_TIME
      # Set as SECRET in App Platform UI (same pooled DATABASE_URL as api):
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      # CanLII Tax Court case law (2010–present); set when API key is received:
      - key: CANLII_API_KEY
        scope: RUN_TIME
        type: SECRET