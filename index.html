    <!--
      Asset-load recovery must run before Vite injects the hashed module entry.
      Vite moves type=module scripts into <head> and drops onerror attributes, so a
      capturing listener is required to recover from stale post-deploy caches.
    -->
    <script>
      (function () {
        var ENTRY_RELOAD_KEY = 'axiom:entry-reload'
        window.__loadAxiomAppFallback = function () {
          try {
            if (window.sessionStorage.getItem(ENTRY_RELOAD_KEY) === '1') return
            window.sessionStorage.setItem(ENTRY_RELOAD_KEY, '1')
          } catch (_) {}
          // Full navigation recovers more reliably than reload() when the module
          // graph already failed midway through evaluation.
          try {
            var url = new URL(window.location.href)
            url.searchParams.set('_boot', String(Date.now()))
            window.location.replace(url.toString())
          } catch (_) {
            window.location.reload()
          }
        }

        function isStaleModuleMessage (message) {
          var msg = String(message || '')
          return (
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1 ||
            msg.indexOf('does not provide an export named') !== -1 ||
            msg.indexOf('Failed to load module script') !== -1 ||
            msg.indexOf('Expected a JavaScript') !== -1 ||
            (msg.indexOf('MIME type') !== -1 && msg.indexOf('text/html') !== -1)
          )
        }

        window.addEventListener('error', function (event) {
          var target = event && event.target
          if (target && target.tagName) {
            var tag = String(target.tagName).toUpperCase()
            if (tag === 'SCRIPT' && target.type === 'module') {
              window.__loadAxiomAppFallback()
              return
            }
            if (tag === 'LINK' && target.rel === 'stylesheet') {
              window.__loadAxiomAppFallback()
              return
            }
          }
          if (isStaleModuleMessage(event && event.message)) {
            window.__loadAxiomAppFallback()
          }
        }, true)

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason
          var message = reason && reason.message ? reason.message : reason
          if (isStaleModuleMessage(message)) {
            window.__loadAxiomAppFallback()
          }
        })

        // If the entry module never mounts React (stale deploy / silent module failure),
        // recover once. Timeout is generous so slow first downloads are not false positives.
        window.setTimeout(function () {
          if (!window.__axiomAppMounted) {
            window.__loadAxiomAppFallback()
          }
        }, 10000)
      })()
    </script>
